name: Publish GitHub Release

on:
  push:
    tags:
      - 'autoclose-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="autoclose-v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Chromium extension
        run: npm run build:extension:chrome

      - name: Prepare release asset
        run: cp dist/chrome-prod.zip "dist/raindrop-app-autoclose-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/raindrop-app-autoclose-${{ steps.version.outputs.version }}.zip" \
            --title "Raindrop AutoClose ${{ steps.version.outputs.version }}" \
            --verify-tag \
            --generate-notes
