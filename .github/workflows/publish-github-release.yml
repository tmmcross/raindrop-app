name: Publish GitHub Release

on:
  push:
    branches:
    - release/production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci

    - name: Build Chrome extension
      run: npm run build:extension:chrome

    - name: Read version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Prepare release asset
      run: cp dist/chrome-prod.zip "dist/raindrop-app-autoclose-${{ steps.version.outputs.version }}.zip"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="autoclose-v${{ steps.version.outputs.version }}"
        gh release create "${TAG}" \
          "dist/raindrop-app-autoclose-${{ steps.version.outputs.version }}.zip" \
          --title "Raindrop.io (AutoClose) ${{ steps.version.outputs.version }}" \
          --target "$GITHUB_SHA" \
          --generate-notes
